<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111113" />
  <title>Status — Shawn Singh</title>
  <meta name="description" content="Live status of shawnsingh.me and the Shawn AI chat, API and MCP server." />
  <link rel="canonical" href="https://status.shawnsingh.me/" />
  <link rel="icon" type="image/svg+xml" href="https://shawnsingh.me/shawnlogo.svg" />
  <style>
    :root {
      --black: #f5f5f7;
      --mid: #98989d;
      --light: #636366;
      --border: #3a3a3c;
      --bg: #111113;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--black); font: 1rem/1.5 var(--sans); }
    main { width: min(720px, calc(100% - 40px)); margin: 0 auto; padding: 72px 0 96px; }
    a { color: inherit; }
    .eyebrow { margin: 0 0 8px; font-size: .75rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--light); }
    h1 { margin: 0 0 8px; font-size: clamp(2.4rem, 6vw, 4rem); letter-spacing: -.03em; line-height: 1.05; }
    .sub { margin: 0 0 40px; color: var(--mid); }
    .banner { margin: 0 0 8px; font-size: clamp(1.3rem, 2.5vw, 1.8rem); font-weight: 700; }
    .meta { margin: 0 0 32px; font-size: .9rem; color: var(--mid); }
    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
    li { display: flex; align-items: baseline; gap: 12px; padding: 18px 0; border-bottom: 1px solid var(--border); }
    b { font-weight: 600; }
    small { display: block; color: var(--mid); font-size: .85rem; }
    .st { margin-left: auto; white-space: nowrap; font-size: .9rem; color: var(--mid); }
    .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--light); transform: translateY(-1px); }
    .up .dot { background: #1f9d55; }
    .slow .dot { background: #d99a16; }
    .down .dot { background: #d6453d; }
    .down .st { color: #d6453d; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Status</p>
    <h1>Is it up?</h1>
    <p class="sub">Live checks of the site and Shawn AI, run from your browser every minute. <a href="https://shawnsingh.me/">shawnsingh.me</a></p>
    <p class="banner" id="banner">Checking…</p>
    <p class="meta" id="meta">&nbsp;</p>
    <ul id="list" aria-live="polite"></ul>
  </main>
  <script>
    const W = 'https://groq-chat.shawnpsi.workers.dev';
    const SITE = 'https://shawnsingh.me';
    const ok = r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r; };
    // The site is another origin, so the browser hides the status code. A
    // network error still throws; an opaque response means the server answered.
    const page = path => () => fetch(SITE + path, { method: 'HEAD', mode: 'no-cors', cache: 'no-store' });
    const health = fetch.bind(null, W + '/health', { cache: 'no-store' });
    let healthRun;
    const model = key => async () => {
      const d = await healthRun;
      if (!d[key]) throw new Error(d.groq === 200 ? 'model no longer served' : 'Groq ' + (d.groq || 'unreachable'));
    };
    const CHECKS = [
      ['Website', 'shawnsingh.me', page('/index.html')],
      ['SayClip', '/sayclip', page('/sayclip/')],
      ['BeatFX', '/beatfx', page('/beatfx/')],
      ['Shawn AI chat', 'The chat on the homepage (Groq)', model('chat')],
      ['Shawn AI API answers', 'GET /api?q= (Groq)', model('api')],
      ['Public API', 'GET /api', () => fetch(W + '/api', { cache: 'no-store' }).then(ok)],
      ['MCP server', 'POST /mcp', () => fetch(W + '/mcp', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: '{"jsonrpc":"2.0","id":1,"method":"ping"}',
      }).then(ok).then(r => r.json()).then(d => { if (!d.result) throw new Error('bad reply'); })],
    ];
    const list = document.getElementById('list');
    const rows = CHECKS.map(([name, sub]) => {
      const li = document.createElement('li');
      li.append(Object.assign(document.createElement('span'), { className: 'dot' }));
      const label = document.createElement('span');
      const b = document.createElement('b');
      const small = document.createElement('small');
      b.textContent = name;
      small.textContent = sub;
      label.append(b, small);
      const st = Object.assign(document.createElement('span'), { className: 'st' });
      st.textContent = 'Checking…';
      li.append(label, st);
      list.append(li);
      return li;
    });
    const withTimeout = p => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('timed out')), 10000))]);

    async function run() {
      healthRun = withTimeout(health().then(r => r.json()));
      healthRun.catch(() => {});
      const results = await Promise.all(CHECKS.map(async ([, , check], i) => {
        const t = performance.now();
        let state, text;
        try {
          await withTimeout(check());
          const ms = Math.round(performance.now() - t);
          state = ms > 3000 ? 'slow' : 'up';
          text = (state === 'up' ? 'Operational' : 'Slow') + ' · ' + ms + ' ms';
        } catch (e) {
          state = 'down';
          text = 'Down · ' + e.message;
        }
        rows[i].className = state;
        rows[i].querySelector('.st').textContent = text;
        return state;
      }));
      const down = results.filter(s => s === 'down').length;
      document.getElementById('banner').textContent =
        !down ? 'All systems operational' : down === results.length ? 'Everything is down' : down + ' of ' + results.length + ' services down';
      document.getElementById('meta').textContent = 'Last checked ' + new Date().toLocaleTimeString() + ' · refreshes every minute';
    }
    run();
    setInterval(run, 60000);
  </script>
</body>
</html>
